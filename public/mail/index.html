<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CASI Mail-Baukasten</title>
<script>
  // Der Mail-Baukasten ist ins Backend der Website umgezogen. Alte Links (#m=… / #s=…) wandern mit.
  (function () {
    var ziel = "https://casinitiative.org/wp-admin/admin.php?page=casi-mailversand";
    var h = location.hash.replace(/^#/, "");
    var m = /^(m|s)=([A-Za-z0-9._-]+)$/.exec(h);
    location.replace(ziel + (m ? "&" + m[1] + "=" + m[2] : ""));
  })();
</script>
<style>body{margin:0;font:17px/1.6 Georgia,serif;color:#0E4D49;background:#fff}main{max-width:640px;margin:0 auto;padding:56px 16px}</style>
</head>
<body>
<main>
  <p>Der Mail-Baukasten ist ins Backend der Website umgezogen: <a href="https://casinitiative.org/wp-admin/admin.php?page=casi-mailversand">zum Mail-Baukasten</a> (WordPress-Login).</p>
</main>
</body>
</html>
